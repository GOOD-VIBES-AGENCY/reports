name: レポートを公開

# 直下にファイルがアップロードされたら自動で整形して公開する
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Actions 自身のコミットでは動かさない（無限ループ防止）
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ファイルを整形して一覧を再生成
        run: python3 .github/scripts/normalize.py

      - name: 変更をコミット
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "レポートを自動整形して公開"
          git push
